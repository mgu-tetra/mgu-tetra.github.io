    <main>
        <section class="hero">
            <img src="images/official_logo_ske_white.png" alt="Tetra Official Logo">
        </section>

        <div class="news-ticker">
            <div class="ticker-container">
                <a href="news/news.html" class="ticker-label">NEWS</a>
                <div class="ticker-list-wrapper">
                    <div class="ticker-track" id="ticker-track">
                        <ul class="ticker-list" id="ticker-list">
                            <!-- Dynamic Content Loaded via JS -->
                        </ul>
                        <ul class="ticker-list ticker-list-clone" id="ticker-list-clone">
                            <!-- Cloned Content for Seamless Loop -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', async () => {
                const tickerList = document.getElementById('ticker-list');
                if (!tickerList) return;

                function escapeHtml(str) {
                    if (!str) return '';
                    const div = document.createElement('div');
                    div.textContent = str;
                    return div.innerHTML;
                }

                function sanitizeUrl(url) {
                    if (!url) return '#';
                    try {
                        const parsed = new URL(url, window.location.href);
                        if (['http:', 'https:'].includes(parsed.protocol)) return url;
                    } catch(e) {}
                    if (url.startsWith('./') || url.startsWith('../') || !url.includes(':')) return url;
                    return '#';
                }

                try {
                    const res = await fetch('news/news_index.json?t=' + Date.now());
                    if (!res.ok) throw new Error('Failed to fetch news index');
                    const newsItems = await res.json();

                    // Sort by date desc
                    const sortedNews = newsItems.sort((a, b) => new Date(b.date) - new Date(a.date));
                    const now = new Date();

                    let hasItems = false;
                    sortedNews.forEach(item => {
                        // Check publication time
                        if (item.publishAt) {
                            const publishDate = new Date(item.publishAt);
                            if (now < publishDate) return; // Skip future items
                        }

                        const li = document.createElement('li');
                        li.className = 'ticker-item';

                        // URL from JSON is relative to root (e.g. ./news/article.html?id=xxx)
                        let linkUrl = item.url;
                        if (!linkUrl && item.id) {
                            linkUrl = `news/article.html?id=${item.id}`;
                        } else if (linkUrl && linkUrl.startsWith('./')) {
                            linkUrl = linkUrl.substring(2);
                        }

                        li.innerHTML = `
                    <a href="${sanitizeUrl(linkUrl)}">
                        <span class="ticker-date">${escapeHtml(item.date)}</span>
                        ${escapeHtml(item.title)}
                    </a>
                `;
                        tickerList.appendChild(li);
                        hasItems = true;
                    });

                    if (hasItems) {
                        // Clone items for seamless loop
                        const tickerListClone = document.getElementById('ticker-list-clone');
                        if (tickerListClone) {
                            tickerListClone.innerHTML = tickerList.innerHTML;
                        }

                        // Dynamically adjust animation duration based on content width for constant speed
                        const tickerTrack = document.getElementById('ticker-track');
                        if (tickerTrack) {
                            // Wait for a render frame to ensure offsetWidth is populated
                            requestAnimationFrame(() => {
                                const listWidth = tickerList.offsetWidth;
                                if (listWidth > 0) {
                                    // 50px per second speed
                                    const speed = 50; 
                                    const duration = listWidth / speed;
                                    tickerTrack.style.animationDuration = `${duration}s`;
                                }
                            });
                        }
                    }
                } catch (error) {
                    console.error('Failed to initialize news ticker:', error);
                }
            });
        </script>

        <div class="container">

                        </a>

                        <a href="graphics/graphics.html">

                            <p class="dept-desc">デザイン、映像編集、プロジェクションマッピング。<br>視覚表現の可能性を追求する。</p>
                        </a>
