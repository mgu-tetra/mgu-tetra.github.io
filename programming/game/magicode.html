<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Unity Web Player | MagiCode</title>
    <link rel="icon" href="../../images/official_logo_sq_ske_white.png" type="image/png">
    <link rel="stylesheet" href="TemplateData/style.css">

  </head>
  <body>
    <div id="unity-container">
      <div id="unity-stage">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="0" aria-label="MagiCode ゲーム画面"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning" role="alert"></div>
      <div id="touch-controls" hidden>
        <div id="touch-dpad" role="group" aria-label="移動">
          <span class="touch-dpad-arrow touch-dpad-up" aria-hidden="true">▲</span>
          <span class="touch-dpad-arrow touch-dpad-down" aria-hidden="true">▼</span>
          <span class="touch-dpad-arrow touch-dpad-left" aria-hidden="true">◀</span>
          <span class="touch-dpad-arrow touch-dpad-right" aria-hidden="true">▶</span>
        </div>
        <div id="touch-buttons">
          <button type="button" class="touch-button touch-button-reset" data-key="reset" tabindex="-1" aria-label="リセット（長押し）">リセット<br>長押し</button>
          <button type="button" class="touch-button touch-button-action" data-key="action" tabindex="-1" aria-label="決定・拾う・置く">決定</button>
        </div>
      </div>
      </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <button id="unity-fullscreen-button" type="button" aria-label="全画面表示" title="全画面表示" disabled hidden></button>
        <div id="unity-build-title">MagiCode</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      var container = document.querySelector("#unity-container");
      var stage = document.querySelector("#unity-stage");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var touchControls = document.querySelector("#touch-controls");
      var dpad = document.querySelector("#touch-dpad");
      var touchButtonColumn = document.querySelector("#touch-buttons");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var message = document.createElement("div");
        message.textContent = msg;
        message.className = type === "error" ? "unity-error" : "unity-notice";
        banner.appendChild(message);
        banner.style.display = "block";
        if (type !== "error") {
          setTimeout(function () {
            message.remove();
            banner.style.display = banner.children.length ? "block" : "none";
          }, 5000);
        }
      }

      // Size only the CSS box. Unity owns the rendering buffer and pixel density.
      function resizeCanvas() {
        // In landscape, keep the touch controls in side gutters instead of over the game.
        var gutterLeft = 0;
        var gutterRight = 0;
        if (!touchControls.hidden && stage.clientWidth > stage.clientHeight) {
          gutterLeft = dpad.offsetLeft + dpad.offsetWidth + 8;
          gutterRight = stage.clientWidth - touchButtonColumn.offsetLeft + 8;
        }
        stage.style.paddingLeft = gutterLeft + "px";
        stage.style.paddingRight = gutterRight + "px";
        var width = Math.min(stage.clientWidth - gutterLeft - gutterRight, stage.clientHeight * 16 / 9);
        canvas.style.width = width + "px";
        canvas.style.height = width * 9 / 16 + "px";
      }

      function updateViewport() {
        var viewport = window.visualViewport;
        container.style.width = (viewport ? viewport.width : window.innerWidth) + "px";
        container.style.height = (viewport ? viewport.height : window.innerHeight) + "px";
        container.style.left = (viewport ? viewport.offsetLeft : 0) + "px";
        container.style.top = (viewport ? viewport.offsetTop : 0) + "px";
        resizeCanvas();
      }
      window.addEventListener("resize", updateViewport);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateViewport);
        window.visualViewport.addEventListener("scroll", updateViewport);
      }
      if (window.ResizeObserver) {
        new ResizeObserver(resizeCanvas).observe(stage);
      }
      updateViewport();

      // Fullscreen the wrapper so the same aspect-ratio layout remains active.
      var requestFullscreen = container.requestFullscreen || container.webkitRequestFullscreen;
      fullscreenButton.hidden = !requestFullscreen;
      fullscreenButton.addEventListener("click", function () {
        var active = document.fullscreenElement || document.webkitFullscreenElement;
        var exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
        try {
          var result = active ? exitFullscreen.call(document) : requestFullscreen.call(container);
          if (result && result.catch) result.catch(function () {
            unityShowBanner("全画面表示に切り替えられませんでした。通常画面でプレイできます。", "warning");
          });
        } catch (error) {
          unityShowBanner("全画面表示はこのブラウザでは利用できません。", "warning");
        }
        canvas.focus();
      });
      function fullscreenChanged() {
        var active = document.fullscreenElement || document.webkitFullscreenElement;
        var label = active ? "全画面表示を終了" : "全画面表示";
        fullscreenButton.setAttribute("aria-label", label);
        fullscreenButton.title = label;
        updateViewport();
        canvas.focus();
      }
      document.addEventListener("fullscreenchange", fullscreenChanged);
      document.addEventListener("webkitfullscreenchange", fullscreenChanged);
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      // Touch controls replay the game's keyboard bindings as synthetic key events.
      // Unity reads key/code for the Input System and keyCode for legacy input.
      var TOUCH_KEYS = {
        up: { key: "ArrowUp", code: "ArrowUp", keyCode: 38 },
        down: { key: "ArrowDown", code: "ArrowDown", keyCode: 40 },
        left: { key: "ArrowLeft", code: "ArrowLeft", keyCode: 37 },
        right: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
        action: { key: " ", code: "Space", keyCode: 32 },
        reset: { key: "r", code: "KeyR", keyCode: 82 },
      };
      var touchButtons = touchControls.querySelectorAll("[data-key]");
      var heldKeys = {};
      var gameReady = false;

      function sendKey(type, name) {
        var def = TOUCH_KEYS[name];
        var event = new KeyboardEvent(type, { key: def.key, code: def.code, bubbles: true, cancelable: true });
        Object.defineProperty(event, "keyCode", { value: def.keyCode });
        Object.defineProperty(event, "which", { value: def.keyCode });
        window.dispatchEvent(event);
      }
      function pressKey(name) {
        if (heldKeys[name]) return;
        heldKeys[name] = true;
        sendKey("keydown", name);
      }
      function releaseKey(name) {
        if (!heldKeys[name]) return;
        delete heldKeys[name];
        sendKey("keyup", name);
      }

      var dpadPointer = null;
      var dpadDir = null;
      function setDpadDir(dir) {
        if (dir === dpadDir) return;
        if (dpadDir) releaseKey(dpadDir);
        dpadDir = dir;
        if (dir) {
          pressKey(dir);
          dpad.setAttribute("data-dir", dir);
        } else {
          dpad.removeAttribute("data-dir");
        }
      }
      // Grid movement: only the dominant axis counts, with a small dead zone in the middle.
      function dpadDirAt(event) {
        var rect = dpad.getBoundingClientRect();
        var x = event.clientX - (rect.left + rect.width / 2);
        var y = event.clientY - (rect.top + rect.height / 2);
        if (Math.max(Math.abs(x), Math.abs(y)) < rect.width * 0.12) return null;
        if (Math.abs(x) > Math.abs(y)) return x > 0 ? "right" : "left";
        return y > 0 ? "down" : "up";
      }
      dpad.addEventListener("pointerdown", function (event) {
        event.preventDefault();
        dpadPointer = event.pointerId;
        dpad.setPointerCapture(event.pointerId);
        setDpadDir(dpadDirAt(event));
      });
      dpad.addEventListener("pointermove", function (event) {
        if (event.pointerId === dpadPointer) setDpadDir(dpadDirAt(event));
      });
      function endDpad(event) {
        if (event.pointerId !== dpadPointer) return;
        dpadPointer = null;
        setDpadDir(null);
      }
      dpad.addEventListener("pointerup", endDpad);
      dpad.addEventListener("pointercancel", endDpad);
      dpad.addEventListener("lostpointercapture", endDpad);

      Array.prototype.forEach.call(touchButtons, function (button) {
        var name = button.getAttribute("data-key");
        button.addEventListener("pointerdown", function (event) {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          button.classList.add("is-pressed");
          pressKey(name);
        });
        function end() {
          button.classList.remove("is-pressed");
          releaseKey(name);
        }
        button.addEventListener("pointerup", end);
        button.addEventListener("pointercancel", end);
        button.addEventListener("lostpointercapture", end);
      });

      // Never leave a key stuck down when the page loses focus mid-press.
      function releaseAllKeys() {
        dpadPointer = null;
        setDpadDir(null);
        Array.prototype.forEach.call(touchButtons, function (button) { button.classList.remove("is-pressed"); });
        Object.keys(heldKeys).forEach(releaseKey);
      }
      window.addEventListener("blur", releaseAllKeys);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) releaseAllKeys();
      });
      touchControls.addEventListener("contextmenu", function (event) { event.preventDefault(); });

      function isTouchDevice() {
        return (window.matchMedia && window.matchMedia("(any-pointer: coarse)").matches) || navigator.maxTouchPoints > 0;
      }
      function showTouchControls() {
        if (!gameReady || !touchControls.hidden) return;
        touchControls.hidden = false;
        resizeCanvas();
      }
      window.addEventListener("pointerdown", function (event) {
        if (event.pointerType === "touch") showTouchControls();
      });

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/MagiCode WebGL Build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/MagiCode WebGL Build.data",
        frameworkUrl: buildUrl + "/MagiCode WebGL Build.framework.js",
        codeUrl: buildUrl + "/MagiCode WebGL Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Tetra",
        productName: "MagiCode",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      function startupFailed(message) {
        loadingBar.style.display = "none";
        unityShowBanner("ゲームを起動できませんでした。WebGL 2・WebAssembly対応のブラウザで再読み込みしてください。\n" + message, "error");
      }
      loadingBar.style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = function () {
        startupFailed("起動ファイルを取得できません。通信状況を確認してください。");
      };
      script.onload = function () {
        try {
          createUnityInstance(canvas, config, function (progress) {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then(function () {
            loadingBar.style.display = "none";
            fullscreenButton.disabled = false;
            gameReady = true;
            if (isTouchDevice()) showTouchControls();
            resizeCanvas();
            canvas.focus();
          }).catch(startupFailed);
        } catch (error) {
          startupFailed(error.message || String(error));
        }
      };

      document.body.appendChild(script);

    </script>
  </body>
</html>
